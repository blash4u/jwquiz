<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그리스도인 생활 성경 구절 퀴즈</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        body { background-color: #FFF7ED; color: #1F2937; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; padding: 30px 20px; width: 100%; max-width: 450px; }

        .btn-primary { background-color: #F97316; color: white; border: none; padding: 15px 40px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover:not(:disabled) { background-color: #EA580C; }
        .btn-primary:disabled { background-color: #d1d5db; cursor: not-allowed; }
        .btn-secondary { background-color: #ffffff; color: #F97316; border: 2px solid #F97316; padding: 12px 30px; font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        .btn-secondary:hover { background-color: #FFF7ED; }

        .btn-mini { background-color: #ffffff; color: #EA580C; border: 1.5px solid #F97316; padding: 4px 10px; font-size: 0.85rem; font-weight: bold; border-radius: 15px; cursor: pointer; transition: 0.2s; }
        .btn-mini:hover { background-color: #FFEDD5; }

        .logo-square {
            width: 100px; height: 100px; background-color: #F97316; border-radius: 0px;
            display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.25);
        }
        .logo-square span { color: #FFF7ED; font-size: 2.8rem; font-weight: 900; letter-spacing: -1px; }

        .sub-title { font-size: 1.1rem; font-weight: normal; color: #431407; margin-bottom: 5px; }
        .main-title { font-size: 1.9rem; margin-bottom: 25px; color: #1F2937; font-weight: bold; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-label { display: block; font-size: 0.95rem; font-weight: bold; color: #431407; margin-bottom: 6px; }
        .text-input { width: 100%; padding: 14px; border: 1.5px solid #FDBA74; border-radius: 10px; font-size: 1.05rem; outline: none; background: #fff; }
        .text-input:focus { border-color: #F97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2); }

        /* 점수판 */
        .score-board { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.1rem; font-weight: bold; color: #431407; }
        .user-info-area { display: flex; align-items: center; gap: 6px; }
        .user-badge { font-size: 0.9rem; color: #EA580C; background: #FFEDD5; padding: 4px 10px; border-radius: 15px; }
        #attempts-icon { font-size: 1.15rem; letter-spacing: 2px; }
        
        #question-text { font-size: 1.25rem; margin-bottom: 20px; font-weight: bold; line-height: 1.5; word-break: keep-all; text-align: left; color: #111827; }
        #category-title { font-size: 0.95rem; color: #F97316; text-align: left; margin-bottom: 8px; font-weight: bold; }

        .choice-btn { 
            position: relative; display: block; width: 100%; text-align: left; padding: 14px; margin-bottom: 12px;
            background-color: #ffffff; color: #1F2937; border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 1.05rem; cursor: pointer; transition: background-color 0.2s;
        }
        .choice-btn:hover:not(:disabled) { background-color: #f3f4f6; border-color: #9ca3af; }
        .choice-btn.wrong { background-color: #f3f4f6; color: #9ca3af; text-decoration: line-through; border-color: #e5e7eb; }
        .choice-number { font-weight: bold; color: #F97316; margin-right: 8px; }

        .tooltip-text {
            visibility: hidden; background-color: #431407; color: #ffffff; text-align: center;
            border-radius: 6px; padding: 10px; position: absolute; z-index: 1;
            bottom: 110%; left: 50%; transform: translateX(-50%); width: 90%;
            font-size: 0.95rem; opacity: 0; transition: opacity 0.2s; pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); white-space: pre-line;
        }
        .choice-btn.show-hint:hover .tooltip-text { visibility: visible; opacity: 1; }

        .feedback-box { display: none; margin-top: 20px; padding: 20px; background-color: #ffedd5; border-radius: 10px; border: 2px solid #F97316; text-align: left; }
        #feedback-title { margin-bottom: 12px; font-size: 1.2rem; font-weight: bold; }
        #feedback-text { line-height: 1.6; word-break: keep-all; white-space: pre-line; }

        /* 모달 스타일 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-card {
            background-color: #ffffff; border-radius: 16px; padding: 25px 20px; max-width: 400px; width: 100%;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 3px solid #F97316;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-icon { font-size: 3rem; margin-bottom: 8px; }
        .modal-title { font-size: 1.35rem; color: #431407; margin-bottom: 6px; font-weight: bold; }
        .modal-desc { font-size: 0.95rem; color: #4B5563; line-height: 1.5; margin-bottom: 15px; }
        .coupon-box {
            background-color: #FFF7ED; border: 2px dashed #F97316; border-radius: 8px;
            padding: 12px; margin-bottom: 16px; font-weight: bold; color: #EA580C; font-size: 1.1rem;
        }

        /* 랭킹 탭 버튼 */
        .rank-tab-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .rank-tab-btn { flex: 1; padding: 8px 0; border: 1.5px solid #F97316; background: #fff; color: #F97316; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .rank-tab-btn.active { background: #F97316; color: #fff; }

        .ranking-list { list-style: none; margin: 10px 0 15px 0; text-align: left; max-height: 230px; overflow-y: auto; }
        .ranking-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px solid #fed7aa; font-size: 0.95rem; }
        .ranking-item.my-rank { font-weight: bold; color: #EA580C; background: #FFEDD5; border-radius: 6px; }
        .ranking-rank { width: 35px; font-weight: bold; }
        .ranking-name { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ranking-score { font-weight: bold; color: #F97316; }
    </style>
</head>
<body>
    <!-- 1. 홈 화면 -->
    <div id="home-screen" class="container">
        <div class="logo-square">
            <span>JW</span>
        </div>
        <h2 class="sub-title">그리스도인 생활을 위한</h2>
        <h1 class="main-title">성경 구절 퀴즈</h1>

        <div class="input-group">
            <label class="input-label" for="username-input">학습자 이름 (닉네임)</label>
            <input type="text" id="username-input" class="text-input" placeholder="이름을 입력해 주세요" maxlength="10">
        </div>
        
        <button id="start-btn" class="btn-primary" style="width: 100%; margin-bottom: 12px;">퀴즈 시작하기</button>
        <button id="view-ranking-btn" class="btn-secondary" style="width: 100%; margin-bottom: 15px;">🏆 순위표 & 명예의 전당</button>
        
        <button id="upload-btn" class="btn-primary" style="width: 100%; background-color: #10B981; font-size: 0.95rem; padding: 10px; display: none;">⚙️ DB에 새로운 데이터 덮어쓰기 (관리자)</button>
    </div>

    <!-- 2. 퀴즈 화면 -->
    <div id="quiz-screen" class="container" style="display: none;">
        <div class="score-board">
            <div class="user-info-area">
                <span class="user-badge" id="player-display">학습자</span>
                <span>💎 <span id="score-text">0</span></span>
                <button id="in-quiz-ranking-btn" class="btn-mini">🏆 등수</button>
            </div>
            <span id="attempts-icon">❤️❤️❤️❤️❤️</span>
        </div>
        <h2 id="category-title"></h2>
        <p id="question-text"></p>
        
        <div id="choices-container"></div>

        <div id="feedback-container" class="feedback-box">
            <h3 id="feedback-title"></h3>
            <p id="feedback-text"></p>
            <button id="next-btn" class="btn-primary" style="margin-top: 20px; width: 100%;">다음 문제로</button>
        </div>
    </div>

    <!-- 3. 다단계 보상 모달 -->
    <div id="reward-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon" id="reward-modal-icon">🎁✨</div>
            <h2 class="modal-title" id="reward-modal-title">깜짝 선물 달성!</h2>
            <p class="modal-desc" id="reward-modal-desc"></p>
            <div class="coupon-box" id="reward-modal-badge">[ 특별 선물 교환권 ]</div>
            <button id="close-reward-btn" class="btn-primary" style="width: 100%;">확인 및 계속하기</button>
        </div>
    </div>

    <!-- 4. 🌟 탭이 포함된 순위표 & 명예의 전당 모달 -->
    <div id="ranking-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title">전당 & 순위표</h2>
            
            <div class="rank-tab-container">
                <button id="tab-realtime" class="rank-tab-btn active">실시간 순위 TOP 10</button>
                <button id="tab-hall" class="rank-tab-btn">👑 명예의 전당 (10000점)</button>
            </div>

            <p id="my-current-rank-text" style="font-size: 0.9rem; color: #EA580C; font-weight: bold; margin-bottom: 8px; min-height: 20px;"></p>
            <ul id="ranking-list-container" class="ranking-list">
                <li class="ranking-item">순위를 불러오는 중...</li>
            </ul>
            <button id="close-ranking-btn" class="btn-primary" style="width: 100%;">닫기</button>
        </div>
    </div>

    <!-- 5. 목숨 소진 게임 오버 모달 -->
    <div id="gameover-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">👏✨</div>
            <h2 class="modal-title">수고하셨습니다!</h2>
            <p class="modal-desc" id="gameover-desc" style="font-size: 1.05rem; line-height: 1.6;">
                준비된 목숨이 모두 소진되었습니다.<br>
                성경 말씀을 열심히 탐구하셨습니다!
            </p>
            <div class="coupon-box" id="gameover-rank-box">
                현재 등수 확인 중...
            </div>
            <button id="gameover-home-btn" class="btn-primary" style="width: 100%;">처음 화면으로 돌아가기</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
